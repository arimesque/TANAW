{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="narrow-card center">
    <p class="eyebrow">Error {{ status }}</p>
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <p><a class="btn btn-primary" href="{{ url_for('home') }}">{{ icon('arrow-left') }} Back to home</a></p>
</section>
{% endblock %}
